# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# Runtime deps so CI installs what the demos import (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern. scikit-image provides skimage.
[dependencies]
pip = [
    "matplotlib",
    "numpy",
    "scikit-image",
    "scipy",
]

# The demos deliberately repeat near-identical boilerplate across files and
# reuse the same file names between chapters; batched pylint/mypy flag the
# duplication (R0801) or merge the module namespace ("Duplicate module").
# Per-file runs keep every per-file check.
[processor.pylint]
batch = false

[processor.mypy]
batch = false
