# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]
batch = false

# batch stays at the default (true): mypy 2.x keeps its incremental cache in a
# SQLite metastore, so running one process per file in parallel makes them
# contend on the same .mypy_cache DB and lose with
# "sqlite3.OperationalError: database is locked" -> INTERNAL ERROR.
[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── notebooks ───────────────────────────────────────────────────────────────

# The notebooks are committed without outputs (the outputs are large, noisy in
# diffs, and go stale). The generator drives scripts/nb_execute.py, which runs
# each notebook with nbconvert and writes the executed copy, outputs included,
# under out/notebooks. That both regenerates the outputs and proves every demo
# still runs against the locked library versions.
[processor.generator.notebooks]
command = "scripts/nb_execute.py"
src_dirs = ["src"]
src_extensions = [".ipynb"]
output_dir = "out/notebooks"
output_extension = "ipynb"
batch = false

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]
